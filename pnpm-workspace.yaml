packages:
  - ".pkgs/*"
  - "apps/*"
  - "packages/*"
  - "examples/*"
allowBuilds:
  dprint: true
  esbuild: true
  msgpackr-extract: true
trustPolicy: "no-downgrade"
minimumReleaseAge: 0
onlyBuiltDependencies:
  - core-js
  - dprint
  - esbuild
  - msgpackr-extract
overrides:
  # security fixes for vulnerable transitive dev dependencies
  "@modelcontextprotocol/server": "^2.3.0"
  "esbuild": "^0.28.2"
  "fast-uri": "^3.1.9"
  "js-yaml": "^4.3.2"
  "markdown-it": "^14.3.3"
  "minimatch": "^11.0.1"
  "postcss": "^8.5.23"
  "source-map-js": "^1.2.2"
  "tslib": "^2.9.1"
  # typescript 7 breaks tsl@1.0.30 (its named ESM imports of SyntaxKind/TypeFlags
  # no longer resolve), so the whole graph is held on 6.0.3 until tsl supports it
  "typescript": "6.0.3"
  "undici": "^8.12.4"
  "vite": "^8.1.6"
patchedDependencies:
  # typedoc 0.28.x calls minimatch's matchOne(), which minimatch 11 removed;
  # drop this patch once typedoc supports minimatch 11
  typedoc@0.28.20: patches/typedoc@0.28.20.patch
