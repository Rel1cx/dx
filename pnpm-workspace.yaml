packages:
  - ".pkgs/*"
  - "apps/*"
  - "packages/*"
  - "packages/*/*"
  - "examples/*"
allowBuilds:
  dprint: true
  esbuild: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - eslint-plugin-jsdoc@64.4.0
onlyBuiltDependencies:
  - core-js
  - dprint
  - esbuild
  - msgpackr-extract
overrides:
  "esbuild": "^0.28.2"
  "tslib": "^2.8.1"
  # typescript 7 breaks tsl@1.0.30 (its named ESM imports of SyntaxKind/TypeFlags
  # no longer resolve), so the whole graph is held on 6.0.3 until tsl supports it
  "typescript": "6.0.3"
  "undici": "^8.10.2"
